<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <title>LEGO Set Cost Dashboard</title>
  </head>
  <body>
    <div class="container">
      <!-- Centered Heading -->
      <h1 class="text-center">LEGO Set Cost Dashboard</h1>

      <!-- Key Metrics Section -->
      <h2 class="mt-5">Key Metrics</h2>
      <div id="key-metrics" class="row text-center my-4">
        <div class="col-md-4">
          <h4>Number of Sets Released</h4>
          <p id="sets-released">0</p>
        </div>
        <div class="col-md-4">
          <h4>Average Pieces per US Big Mac</h4>
          <p id="average-pieces-per-us-big-mac">0</p>
        </div>
        <div class="col-md-4">
          <h4>Average Pieces per Pound</h4>
          <p id="average-pieces-per-pound">0</p>
        </div>
      </div>

      <!-- Chart Section -->
      <div class="chart-section my-4">
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="category-filter">Theme</label>
            <select id="category-filter" class="form-control">
              <option value="all">All Themes</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="sub-theme-filter">Sub-Theme</label>
            <select id="sub-theme-filter" class="form-control">
              <option value="all">All Sub-Themes</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="chart-type-selector">Select Chart:</label>
            <select id="chart-type-selector" class="form-control">
              <option value="ppbm_us">Pieces per Big Mac (US)</option>
              <option value="ppbm_gb">Pieces per Big Mac (UK)</option>
              <option value="ppbm_eu">Pieces per Big Mac (EU)</option>
              <option value="ppsp">Pieces per S&amp;P 500</option>
              <option value="ppp">Pieces per Pound</option>
              <option value="ppd">Pieces per Dollar</option>
              <option value="ppe">Pieces per Euro</option>
            </select>
          </div>
        </div>
        <canvas id="chart-canvas"></canvas>
      </div>

      <p id="data-status" class="text-danger" role="alert"></p>

      <section class="my-4" aria-labelledby="theme-scatter-heading">
        <h3 id="theme-scatter-heading">Typical Set Size and UK Price by Theme</h3>
        <canvas
          id="theme-scatter-canvas"
          aria-label="Scatter plot of median UK set price and median piece count by theme, sized by number of sets"
          role="img"
        ></canvas>
      </section>

      <section
        id="sub-theme-chart-section"
        class="my-4"
        aria-labelledby="sub-theme-chart-heading"
        hidden
      >
        <div class="d-flex justify-content-between align-items-center">
          <h3 id="sub-theme-chart-heading">Typical Set Size and UK Price by Sub-Theme</h3>
          <button
            id="close-sub-theme-chart"
            class="btn btn-outline-secondary btn-sm"
            type="button"
          >
            Close
          </button>
        </div>
        <div id="sub-theme-chart-container">
          <canvas
            id="sub-theme-scatter-canvas"
            aria-label="Scatter plot of median UK set price and median piece count by sub-theme, sized by number of sets"
            role="img"
          ></canvas>
        </div>
      </section>

      <!-- Raw Data Table Section -->
      <div id="raw-data" class="my-4">
        <div class="d-flex justify-content-between align-items-center">
          <h3 id="raw-data-heading">Raw Data</h3>
          <button
            id="clear-scatter-selection"
            class="btn btn-outline-secondary btn-sm"
            type="button"
            hidden
          >
            Clear scatter selection
          </button>
        </div>
        <table
          id="data-table"
          class="table table-striped table-bordered"
        ></table>
      </div>
    </div>

    <!-- Required JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
